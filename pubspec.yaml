name: movie_discovery
description: A Movie Discovery App built using Flutter, TMDB API, and BLoC architecture.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^8.1.4
  equatable: ^2.0.5

  # API / Networking
  http: ^1.2.0

  # Local Storage
  shared_preferences: ^2.2.3

  # UI Enhancements
  google_fonts: ^6.2.1
  lottie: ^3.1.1
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"